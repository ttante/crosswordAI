[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crosswordai"
version = "0.1.0"
description = "Production-grade themed crossword generation platform foundation."
readme = "plan.md"
requires-python = ">=3.12"
authors = [{ name = "crosswordsAI" }]
dependencies = [
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
crosswordai = "crosswordai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
