    size: M
    risk: Low
    depends_on: [CORE-002]
    summary: >-
      Add model, prompt, route, policy, source-connector, and wordlist registries loaded
      from versioned config with validation.
    acceptance:
      - Registries load from versioned config.
      - Invalid registry entries fail validation.
      - CLI can inspect active registry versions.
    required_tests:
      - Tests that valid registry config loads and invalid entries fail validation.
      - CLI test for `registries inspect` output.
    likely_files:
