      observability -> protected eval gate so the product loop is traceable, testable, and publish-gated
      before live services are introduced.
    acceptance:
      - Every run creates a durable run record and immutable artifacts.
      - Every published puzzle has source IDs, QA gates, model lineage, public-safe exports, trace spans, and eval evidence.
      - Hard-gate failures quarantine the puzzle and still produce inspectable artifacts.
      - The full path runs locally without external credentials, then can swap to production adapters behind existing interfaces.
    required_tests:
      - End-to-end test of the hardened core path producing durable run record + immutable artifacts.
      - Test that hard-gate failure quarantines yet still produces inspectable artifacts.
    likely_files:
      - src/crosswordai/core_path.py
    rollback: Revert to per-stage execution without the unified hardened pipeline.
    notes: >-
      MATURITY_ROADMAP rank P0.1 (depends on core Tickets 1-29). Implemented entrypoint:
      HardenedCorePathPipeline in src/crosswordai/core_path.py. First production objective:
      harden the core path end to end before broadening adapters, scale, and UI.

