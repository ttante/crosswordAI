# Foreman canonical ticket definitions for crosswordsAI.
#
# Sources preserved here:
#   - plan.md  Section 26 "Implementation Tickets And Build Order"  -> CORE-001..CORE-029
#     (exit criteria + IMPLEMENTATION_STATUS.md "Future production tasks" captured in acceptance/notes)
#   - MATURITY_ROADMAP.md "Prioritized Backlog" (P0.1..P2.2)         -> MAT-P0-1..MAT-P2-2
#   - docs/web-app-plan.md "Build Sequence And Tickets"             -> WEB-001..WEB-032
#
# Status/progress is intentionally NOT stored here; Foreman tracks state separately.
# IDs preserve the original source numbering. "order" uses 1000-step gaps.

tickets:
  # ---------------------------------------------------------------------------
  # Core pipeline build order (plan.md Section 26). Original IDs: "Ticket 1".."Ticket 29".
  # ---------------------------------------------------------------------------
  - id: CORE-001
    order: 1000
    title: Python Project Foundation
    area: platform
    priority: P0
    size: M
    risk: Low
    depends_on: []
    summary: >-
      Stand up the Python package, CLI framework, config loading, local dev settings,
      structured JSON logging, typed artifact/run IDs, and a basic test harness.
    acceptance:
      - "`crosswordai --help` works."
      - A no-op command creates a run ID and structured log.
      - Unit tests run locally.
    required_tests:
      - Unit test that a no-op CLI command emits a run ID and a structured JSON log line.
      - Test harness boots and discovers tests locally.
    likely_files:
      - src/crosswordai/__init__.py
      - src/crosswordai/cli.py
      - src/crosswordai/config.py
      - tests/
    rollback: Revert package scaffold commit; no runtime data created.
    notes: >-
      Original plan.md Ticket 1 (status Complete, maturity Local). Future production tasks:
      add lint/type-check tooling, package lock strategy, release/build workflow,
      contributor docs, and a CI matrix.

  - id: CORE-002
    order: 2000
    title: Postgres, Migrations, And Object Storage
    area: platform
    priority: P0
    size: L
    risk: Medium
    depends_on: [CORE-001]
    summary: >-
      Add Postgres schema migrations, an object-storage abstraction, artifact metadata
      tables, immutable artifact write/read helpers, and a local development storage backend.
    acceptance:
      - A run can store and retrieve structured metadata plus an object artifact.
      - Storage helpers are covered by tests.
    required_tests:
      - Tests for immutable artifact write/read round-trip.
      - Tests for metadata persistence and retrieval through the storage abstraction.
    likely_files:
      - migrations/
      - src/crosswordai/storage.py
      - src/crosswordai/db.py
    rollback: Drop new migrations and remove storage helpers; local artifacts are disposable.
    notes: >-
      Original plan.md Ticket 2 (Complete, Adapter-ready). Future production tasks:
      run live Postgres/pgvector integration tests, implement full Postgres source-pack
      persistence, validate S3/MinIO adapter with credentials, add backup/restore checks.

  - id: CORE-003
